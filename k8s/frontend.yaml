apiVersion: apps/v1
kind: Deployment
metadata:
  name: softools-fe-deployment
  namespace: softools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: softools-fe
  template:
    metadata:
      labels:
        app: softools-fe
    spec:
      containers:
        - name: softools-fe
          image: inddocker786/softools-fe:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: softools-fe-service
  namespace: softools
spec:
  selector:
    app: softools-fe
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
